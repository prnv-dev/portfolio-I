  <text clip-path="url(#c0)" x="60" y="104" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17"><tspan fill="#22d3ee">$</tspan><tspan fill="#e6e9ee" dx="12">whoami</tspan></text>
  <text x="60" y="134" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" xml:space="preserve" opacity="0"><tspan fill="#e6e9ee">pranav kadam</tspan><tspan fill="#94a3b8"> — software engineer · desktop · web · ai</tspan><animate attributeName="opacity" from="0" to="1" begin="1.28s" dur=".4s" fill="freeze"/></text>
